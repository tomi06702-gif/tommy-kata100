<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>英語の型100選 — 覚えるための英文法シート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2A38;
    --ink-soft: #4A5A68;
    --paper: #EEF3EE;
    --card: #FFFFFF;
    --line: #D8E0D8;

    --basic: #C98A16;
    --basic-bg: #FBF1DD;
    --expr: #1F7A70;
    --expr-bg: #E3F2EF;
    --adv: #B4472A;
    --adv-bg: #FBE9E2;

    --font-ja: 'Zen Maru Gothic', sans-serif;
    --font-en: 'Space Grotesk', sans-serif;
  }

  * { box-sizing: border-box; }

  html { scroll-padding-top: 76px; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-ja);
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 100px;
  }

  header.hero {
    padding: 44px 4px 28px;
  }

  .kicker {
    font-family: var(--font-en);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  h1 {
    font-size: clamp(26px, 6vw, 38px);
    font-weight: 900;
    margin: 0 0 12px;
    line-height: 1.4;
  }

  h1 .en {
    font-family: var(--font-en);
    font-weight: 700;
    color: var(--basic);
  }

  .hero-sub {
    color: var(--ink-soft);
    font-size: 15px;
    max-width: 52ch;
  }

  /* sticky search / nav bar */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--paper);
    padding: 12px 4px 16px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .toolbar-inner { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  .search-box {
    flex: 1;
    min-width: 180px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    font-family: var(--font-ja);
    font-size: 15px;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    outline: none;
  }
  .search-box input:focus { border-color: var(--basic); }
  .search-box input::placeholder { color: #9AA6A0; }

  .nav-pills { display: flex; gap: 8px; }
  .nav-pill {
    font-family: var(--font-en);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
    border: 1px solid transparent;
    cursor: pointer;
  }
  .nav-pill.basic { color: var(--basic); background: var(--basic-bg); }
  .nav-pill.expr { color: var(--expr); background: var(--expr-bg); }
  .nav-pill.adv  { color: var(--adv); background: var(--adv-bg); }

  .count-note {
    font-family: var(--font-en);
    font-size: 12px;
    color: var(--ink-soft);
    padding: 6px 4px 0;
  }

  section.group { margin-top: 36px; }

  .group-head {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding-left: 4px;
    margin-bottom: 16px;
  }
  .group-head h2 { font-size: 19px; margin: 0; font-weight: 700; }
  .group-head .group-en {
    font-family: var(--font-en);
    font-size: 13px;
    color: var(--ink-soft);
  }

  .cards { display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    border-left: 4px solid var(--line);
  }
  .card.basic { border-left-color: var(--basic); }
  .card.expr  { border-left-color: var(--expr); }
  .card.adv   { border-left-color: var(--adv); }

  .card-top {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .card-num {
    font-family: var(--font-en);
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .card-ja {
    font-size: 14px;
    color: var(--ink-soft);
  }

  .card-pattern {
    font-family: var(--font-en);
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .card.basic .card-pattern { color: var(--basic); }
  .card.expr  .card-pattern { color: var(--expr); }
  .card.adv   .card-pattern { color: var(--adv); }

  .card-examples { display: flex; flex-direction: column; gap: 6px; }
  .ex {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    align-items: baseline;
    font-size: 14.5px;
    padding: 2px 0;
  }
  .ex-en { font-family: var(--font-en); font-weight: 500; }
  .ex-ja { color: var(--ink-soft); font-size: 13px; }

  .card.hidden { display: none; }

  /* --- tabs --- */
  .tabs { display: flex; gap: 8px; margin-bottom: 2px; }
  .tab-btn {
    font-family: var(--font-ja);
    font-size: 14px;
    font-weight: 700;
    padding: 9px 16px;
    border-radius: 10px 10px 0 0;
    border: 1px solid var(--line);
    border-bottom: none;
    background: var(--paper);
    color: var(--ink-soft);
    cursor: pointer;
  }
  .tab-btn.active { background: var(--card); color: var(--ink); }
  .view { display: none; }
  .view.active { display: block; }

  /* --- detail (解説) view --- */
  .usage {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--paper);
    border-radius: 10px;
    padding: 10px 14px;
    margin: 10px 0 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }
  .usage .tag {
    flex-shrink: 0;
    font-family: var(--font-en);
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .card.basic .usage .tag { background: var(--basic-bg); color: var(--basic); }
  .card.expr  .usage .tag { background: var(--expr-bg); color: var(--expr); }
  .card.adv   .usage .tag { background: var(--adv-bg); color: var(--adv); }

  .detail-card .card-pattern { font-size: 24px; }
  .detail-card .ex { font-size: 15.5px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .detail-card .ex:first-child { border-top: none; }

  .detail-card .formula {
    background: var(--paper);
    border-radius: 10px;
    padding: 12px 14px;
    margin: 4px 0 12px;
  }
  .detail-card .formula-label { font-size: 12px; color: var(--ink-soft); margin-bottom: 4px; }
  .detail-card .formula-body { font-family: var(--font-en); font-size: 16px; font-weight: 600; }

  .app-section { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .app-title { font-size: 13px; font-weight: 700; color: var(--ink-soft); margin-bottom: 10px; }
  .app-block { margin-bottom: 14px; }
  .app-block:last-child { margin-bottom: 0; }
  .app-label {
    font-family: var(--font-en);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-soft);
    background: var(--paper);
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    margin-bottom: 6px;
  }
  .app-pattern { font-family: var(--font-en); font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .card.basic .app-pattern { color: var(--basic); }
  .card.expr  .app-pattern { color: var(--expr); }
  .card.adv   .app-pattern { color: var(--adv); }

  .empty-msg {
    text-align: center;
    color: var(--ink-soft);
    font-size: 14px;
    padding: 40px 0;
    display: none;
  }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 56px;
  }
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <div class="kicker">GRAMMAR PATTERN · 001–100</div>
    <h1>英語の型 <span class="en">100</span> — 覚えるためのシート</h1>
    <p class="hero-sub">「私は〜です」から始まり、日常会話でよく使う型を100個まとめました。検索や絞り込みで見たい型をすぐに探せます。</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" id="tab-btn-list" data-view="list">📋 一覧</button>
    <button class="tab-btn" id="tab-btn-detail" data-view="detail">📖 解説</button>
  </div>

  <div class="toolbar">
    <div class="toolbar-inner">
      <div class="search-box">
        <input id="search" type="text" placeholder="型・例文・日本語で検索（例：思う、can、痛い）">
      </div>
      <div class="nav-pills">
        <button class="nav-pill basic" data-group="basic">基本 1–21</button>
        <button class="nav-pill expr" data-group="expr">会話表現 22–72</button>
        <button class="nav-pill adv" data-group="adv">応用文法 73–100</button>
      </div>
    </div>
    <div class="count-note" id="count-note"></div>
  </div>

  <div class="view active" id="view-list">
    <div id="root"></div>
  </div>
  <div class="view" id="view-detail">
    <div id="root-detail"></div>
  </div>
  <p class="empty-msg" id="empty-msg">一致する型が見つかりません。</p>

  <footer>英語の型100選 · 1〜100</footer>
</div>

<script>
const DATA = [
  {n:1,ja:"私は〜です",g:"basic",en:"I'm ~",ex:[["I'm a nurse.","私は看護師です"],["I'm from Osaka.","私は大阪出身です"]]},
  {n:2,ja:"これは〜です",g:"basic",en:"This is ~",ex:[["This is my bag.","これは私のかばんです"],["This is important.","これは重要です"]]},
  {n:3,ja:"〜します",g:"basic",en:"I ~ (現在形)",ex:[["I drink coffee every morning.","毎朝コーヒーを飲みます"],["I work at a bank.","私は銀行で働いています"]]},
  {n:4,ja:"〜しています",g:"basic",en:"I'm ~ing",ex:[["I'm cooking dinner.","夕飯を作っています"],["I'm studying English now.","今、英語を勉強しています"]]},
  {n:5,ja:"〜すると思います",g:"basic",en:"I think ~ will ~",ex:[["I think it will rain tomorrow.","明日は雨が降ると思います"],["I think he'll be late.","彼は遅れると思います"]]},
  {n:6,ja:"〜するつもりです",g:"basic",en:"I'm going to ~",ex:[["I'm going to visit my parents this weekend.","今週末、両親を訪ねるつもりです"],["I'm going to start a new job next month.","来月、新しい仕事を始めるつもりです"]]},
  {n:7,ja:"〜しました",g:"basic",en:"I ~ed",ex:[["I watched a movie yesterday.","昨日映画を見ました"],["I finished my homework.","宿題を終わらせました"]]},
  {n:8,ja:"〜したことがあります",g:"basic",en:"I've ~ed before",ex:[["I've been to Korea.","韓国に行ったことがあります"],["I've tried sushi before.","前に寿司を食べたことがあります"]]},
  {n:9,ja:"（もう）〜しました",g:"basic",en:"I've already ~ed",ex:[["I've already eaten lunch.","もう昼ご飯を食べました"],["I've already finished the report.","レポートはもう終わらせました"]]},
  {n:10,ja:"〜できます①",g:"basic",en:"I can ~",ex:[["I can swim.","私は泳げます"],["I can speak a little French.","少しフランス語が話せます"]]},
  {n:11,ja:"〜できます②",g:"basic",en:"I'm able to ~",ex:[["I'm able to work from home.","在宅勤務ができます"],["I'm able to handle this on my own.","これは一人で対応できます"]]},
  {n:12,ja:"〜しなければならない①",g:"basic",en:"I have to ~",ex:[["I have to leave now.","もう行かなければなりません"],["I have to finish this by Friday.","金曜日までにこれを終わらせなければなりません"]]},
  {n:13,ja:"〜しなければならない②",g:"basic",en:"I must ~",ex:[["I must call him back.","彼に折り返し電話しなければならない"],["You must be careful here.","ここでは気をつけなければならないよ"]]},
  {n:14,ja:"〜したい①",g:"basic",en:"I want to ~",ex:[["I want to travel abroad.","海外を旅行したい"],["I want to learn how to cook.","料理を習いたい"]]},
  {n:15,ja:"〜したいです②",g:"basic",en:"I'd like to ~",ex:[["I'd like to make a reservation.","予約をしたいのですが"],["I'd like to ask you something.","ひとつお聞きしたいのですが"]]},
  {n:16,ja:"〜がいます/あります",g:"basic",en:"There is/are ~",ex:[["There's a cat in the garden.","庭に猫がいます"],["There are three books on the desk.","机の上に本が3冊あります"]]},
  {n:17,ja:"〜は誰？",g:"basic",en:"Who is ~?",ex:[["Who is that man?","あの男の人は誰ですか？"],["Who is your favorite singer?","好きな歌手は誰？"]]},
  {n:18,ja:"〜はいつ？",g:"basic",en:"When is/does ~?",ex:[["When is your birthday?","誕生日はいつ？"],["When does the movie start?","映画はいつ始まりますか？"]]},
  {n:19,ja:"〜はどこ？",g:"basic",en:"Where is ~?",ex:[["Where is the station?","駅はどこですか？"],["Where do you live?","どこに住んでいますか？"]]},
  {n:20,ja:"どうして〜？",g:"basic",en:"Why ~?",ex:[["Why are you late?","どうして遅れたの？"],["Why did you choose this job?","どうしてこの仕事を選んだの？"]]},
  {n:21,ja:"〜はどう？",g:"basic",en:"How about ~? / How is ~?",ex:[["How about some coffee?","コーヒーはどう？"],["How was your trip?","旅行はどうだった？"]]},

  {n:22,ja:"〜が好きです",g:"expr",en:"I like ~",ex:[["I like reading books.","本を読むのが好きです"],["I like this song.","この曲が好きです"]]},
  {n:23,ja:"〜をいただきたいのですが",g:"expr",en:"I'd like ~, please.",ex:[["I'd like the set menu, please.","セットメニューをいただきたいのですが"],["I'd like a receipt, please.","レシートをいただきたいのですが"]]},
  {n:24,ja:"〜しよう",g:"expr",en:"Let's ~",ex:[["Let's take a break.","休憩しよう"],["Let's go there together.","一緒にそこへ行こう"]]},
  {n:25,ja:"〜だと思うよ①",g:"expr",en:"I think ~",ex:[["I think it's a good idea.","それはいい考えだと思うよ"],["I think she's right.","彼女は正しいと思うよ"]]},
  {n:26,ja:"〜だと思うよ②",g:"expr",en:"I guess ~",ex:[["I guess he's busy.","彼は忙しいんだと思うよ"],["I guess it's fine.","それで大丈夫だと思うよ"]]},
  {n:27,ja:"〜だと思うよ③",g:"expr",en:"I feel like ~",ex:[["I feel like something's wrong.","何かおかしいと思うよ"],["I feel like this is the right choice.","これが正しい選択だと思うよ"]]},
  {n:28,ja:"〜だといいな",g:"expr",en:"I hope ~",ex:[["I hope it works out.","うまくいくといいな"],["I hope you feel better soon.","早く良くなるといいな"]]},
  {n:29,ja:"前は〜だったよ",g:"expr",en:"I used to ~",ex:[["I used to live in Osaka.","前は大阪に住んでいたよ"],["I used to play soccer.","前はサッカーをしていたよ"]]},
  {n:30,ja:"〜させて",g:"expr",en:"Let me ~",ex:[["Let me think about it.","考えさせて"],["Let me help you with that.","それ手伝わせて"]]},
  {n:31,ja:"〜をありがとう",g:"expr",en:"Thank you for ~",ex:[["Thank you for your help.","手伝ってくれてありがとう"],["Thank you for coming today.","今日は来てくれてありがとう"]]},
  {n:32,ja:"〜してごめんね",g:"expr",en:"Sorry for ~ / Sorry I ~",ex:[["I'm sorry for being late.","遅れてごめんね"],["Sorry I forgot to call you.","電話するの忘れてごめんね"]]},
  {n:33,ja:"〜じゃない？",g:"expr",en:"Isn't it ~? / Don't you think ~?",ex:[["Isn't it cold today?","今日寒くない？"],["Don't you think that's strange?","それって変じゃない？"]]},
  {n:34,ja:"〜わけではない",g:"expr",en:"It's not that ~",ex:[["It's not that I don't like it.","嫌いなわけではない"],["It's not that I'm angry.","怒っているわけではない"]]},
  {n:35,ja:"そんなに〜じゃないよ",g:"expr",en:"It's not that ~",ex:[["It's not that expensive.","そんなに高くないよ"],["It's not that difficult.","そんなに難しくないよ"]]},
  {n:36,ja:"〜すぎるよ",g:"expr",en:"It's too ~",ex:[["It's too expensive.","高すぎるよ"],["You're working too hard.","働きすぎだよ"]]},
  {n:37,ja:"〜はずです",g:"expr",en:"~ should be ~",ex:[["He should be home by now.","彼はもう家にいるはずです"],["It should be ready soon.","もうすぐ準備できるはずです"]]},
  {n:38,ja:"〜するはずでした",g:"expr",en:"~ was supposed to ~",ex:[["I was supposed to meet her today.","今日彼女に会うはずでした"],["The train was supposed to arrive at 9.","電車は9時に着くはずでした"]]},
  {n:39,ja:"〜かもしれない①",g:"expr",en:"~ might ~",ex:[["It might rain later.","あとで雨が降るかもしれない"],["He might be at home.","彼は家にいるかもしれない"]]},
  {n:40,ja:"〜かもしれない②",g:"expr",en:"~ may ~",ex:[["This may take a while.","これは時間がかかるかもしれない"],["She may not come today.","彼女は今日来ないかもしれない"]]},
  {n:41,ja:"〜すべきだよ",g:"expr",en:"You should ~",ex:[["You should see a doctor.","病院に行くべきだよ"],["You should try this.","これ試してみるべきだよ"]]},

  {n:43,ja:"〜のはずがない",g:"expr",en:"There's no way ~",ex:[["There's no way he said that.","彼がそんなこと言うはずがない"],["There's no way it's true.","それが本当のはずがない"]]},
  {n:44,ja:"〜に違いない",g:"expr",en:"~ must be ~",ex:[["She must be tired.","彼女は疲れているに違いない"],["It must be true.","それは本当に違いない"]]},

  {n:51,ja:"どんな〜？",g:"expr",en:"What kind of ~?",ex:[["What kind of music do you like?","どんな音楽が好き？"],["What kind of person is he?","彼はどんな人？"]]},

  {n:57,ja:"〜に似ている",g:"expr",en:"~ is similar to ~ / looks like ~",ex:[["This song is similar to that one.","この曲はあの曲に似ている"],["She looks like her mother.","彼女はお母さんに似ている"]]},

  {n:59,ja:"〜おめでとう！",g:"expr",en:"Congratulations on ~!",ex:[["Congratulations on your graduation!","卒業おめでとう！"],["Congratulations on your new job!","新しい仕事おめでとう！"]]},

  100:{a:{label:"別表現",pattern:"It goes without saying that ~.",ex:[["It goes without saying that health comes first.","健康が一番大切なのは言うまでもない"],["It goes without saying that practice matters.","練習が大事なのは言うまでもない"]]},b:{label:"疑問形",pattern:"Isn't it obvious that ~?",ex:[["Isn't it obvious that he's right?","彼が正しいのは明らかじゃない？"],["Isn't it obvious that we need a break?","休憩が必要なのは明らかじゃない？"]]}}
};

const GROUPS = [
  {key:"basic", title:"基本", en:"BASIC TENSES & QUESTIONS · 1–21"},
  {key:"expr",  title:"会話でよく使う表現", en:"EVERYDAY EXPRESSIONS · 22–72"},
  {key:"adv",   title:"応用文法", en:"ADVANCED STRUCTURES · 73–100"}
];

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function searchBlob(d) {
  return escapeHtml((d.ja + ' ' + d.en + ' ' + (USAGE[d.n]||'') + ' ' + d.ex.map(e=>e[0]+' '+e[1]).join(' ')).toLowerCase());
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = GROUPS.map(g => {
    const items = DATA.filter(d => d.g === g.key);
    const cards = items.map(d => `
      <div class="card ${d.g}" data-search="${searchBlob(d)}">
        <div class="card-top">
          <span class="card-num">No.${d.n}</span>
          <span class="card-ja">${escapeHtml(d.ja)}</span>
        </div>
        <div class="card-pattern">${escapeHtml(d.en)}</div>
        <div class="card-examples">
          ${d.ex.map(e => `<div class="ex"><span class="ex-en">${escapeHtml(e[0])}</span><span class="ex-ja">${escapeHtml(e[1])}</span></div>`).join('')}
        </div>
      </div>
    `).join('');
    return `
      <section class="group" id="group-${g.key}">
        <div class="group-head">
          <h2>${g.title}</h2>
          <span class="group-en">${g.en}</span>
        </div>
        <div class="cards">${cards}</div>
      </section>
    `;
  }).join('');
}

function renderDetail() {
  const root = document.getElementById('root-detail');
  root.innerHTML = GROUPS.map(g => {
    const items = DATA.filter(d => d.g === g.key);
    const cards = items.map(d => {
      const app = APP[d.n];
      return `
      <div class="card detail-card ${d.g}" data-search="${searchBlob(d)}">
        <div class="card-top">
          <span class="card-num">No.${d.n}</span>
          <span class="card-ja">${escapeHtml(d.ja)}</span>
        </div>
        <div class="card-pattern">${escapeHtml(d.en)}</div>
        <div class="formula">
          <div class="formula-label">基本パターン</div>
          <div class="formula-body">${escapeHtml(FORMULA[d.n] || '')}</div>
        </div>
        <div class="usage"><span class="tag">こんな時に使える</span><span>${escapeHtml(USAGE[d.n] || '')}</span></div>
        <div class="card-examples">
          ${d.ex.map(e => `<div class="ex"><span class="ex-en">${escapeHtml(e[0])}</span><span class="ex-ja">${escapeHtml(e[1])}</span></div>`).join('')}
        </div>
        ${app ? `
        <div class="app-section">
          <div class="app-title">応用</div>
          <div class="app-block">
            <span class="app-label">${escapeHtml(app.a.label)}</span>
            <div class="app-pattern">${escapeHtml(app.a.pattern)}</div>
            <div class="card-examples">
              ${app.a.ex.map(e => `<div class="ex"><span class="ex-en">${escapeHtml(e[0])}</span><span class="ex-ja">${escapeHtml(e[1])}</span></div>`).join('')}
            </div>
          </div>
          <div class="app-block">
            <span class="app-label">${escapeHtml(app.b.label)}</span>
            <div class="app-pattern">${escapeHtml(app.b.pattern)}</div>
            <div class="card-examples">
              ${app.b.ex.map(e => `<div class="ex"><span class="ex-en">${escapeHtml(e[0])}</span><span class="ex-ja">${escapeHtml(e[1])}</span></div>`).join('')}
            </div>
          </div>
        </div>` : ''}
      </div>
    `;
    }).join('');
    return `
      <section class="group" id="group-${g.key}-d">
        <div class="group-head">
          <h2>${g.title}</h2>
          <span class="group-en">${g.en}</span>
        </div>
        <div class="cards">${cards}</div>
      </section>
    `;
  }).join('');
}

function filterCards(query) {
  const q = query.trim().toLowerCase();
  const cards = document.querySelectorAll('.card');
  let visible = 0;
  const activeView = document.getElementById('view-list').classList.contains('active') ? 'list' : 'detail';
  cards.forEach(c => {
    const match = !q || c.dataset.search.includes(q);
    c.classList.toggle('hidden', !match);
    if (match && c.closest(activeView === 'list' ? '#view-list' : '#view-detail')) visible++;
  });
  document.querySelectorAll('.group').forEach(sec => {
    const anyVisible = Array.from(sec.querySelectorAll('.card')).some(c => !c.classList.contains('hidden'));
    sec.style.display = anyVisible ? '' : 'none';
  });
  const totalInView = document.querySelectorAll(`#${activeView === 'list' ? 'view-list' : 'view-detail'} .card`).length;
  document.getElementById('empty-msg').style.display = (q && visible === 0) ? 'block' : 'none';
  document.getElementById('count-note').textContent = q ? `${visible} / ${totalInView} 件` : '';
}

function setActiveView(view) {
  document.getElementById('view-list').classList.toggle('active', view === 'list');
  document.getElementById('view-detail').classList.toggle('active', view === 'detail');
  document.getElementById('tab-btn-list').classList.toggle('active', view === 'list');
  document.getElementById('tab-btn-detail').classList.toggle('active', view === 'detail');
  filterCards(document.getElementById('search').value);
}

render();
renderDetail();

document.getElementById('search').addEventListener('input', e => filterCards(e.target.value));
document.getElementById('tab-btn-list').addEventListener('click', () => setActiveView('list'));
document.getElementById('tab-btn-detail').addEventListener('click', () => setActiveView('detail'));
document.querySelectorAll('.nav-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    const activeView = document.getElementById('view-list').classList.contains('active') ? 'list' : 'detail';
    const suffix = activeView === 'list' ? '' : '-d';
    const target = document.getElementById(`group-${btn.dataset.group}${suffix}`);
    if (target) target.scrollIntoView({behavior:'smooth', block:'start'});
  });
});
</script>
</body>
</html>
